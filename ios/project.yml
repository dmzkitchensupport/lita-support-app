name: LiTa
options:
  bundleIdPrefix: support.lita
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 77R5K7935X
    SWIFT_VERSION: "5.0"
targets:
  LiTa:
    type: application
    platform: iOS
    sources:
      - path: LiTa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: support.lita.app
        PRODUCT_NAME: LiTa Support
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "LiTa Support App Store"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LiTa/Info.plist
    info:
      path: LiTa/Info.plist
      properties:
        CFBundleDisplayName: LiTa Support
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: LiTa Support usa la cámara para tomar la evidencia fotográfica de los registros de cocina (temperaturas, limpieza y recepción).
        NSMicrophoneUsageDescription: LiTa Support usa el micrófono solo cuando tocas dictado para capturar notas por voz.
        NSPhotoLibraryUsageDescription: LiTa Support te deja adjuntar fotos de tu galería como evidencia de los registros de cocina.
        NSLocationWhenInUseUsageDescription: LiTa Support agrega la ubicación a las fotos de evidencia para comprobar en qué sucursal se tomaron.
        WKAppBoundDomains:
          - app.litasupport.com
          - litasupport.com
          - vitality-control.github.io
          - cdjsupport.github.io
          - dmzkitchensupport.github.io
