<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>LiTa Support — Acceso</title>
<meta name="description" content="Acceso único LiTa Support">
<meta name="theme-color" content="#15181A">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./tokens.css">
<style>
  /* LiTa Support — Login Único · piel "D homologada" (decisión de Mario, 25 sep 2026,
     ver ~/DMZ/lita-design-handoff/HANDOFF.md). Fuente única de valores: tokens.css.
     Dos valores puntuales de este prototipo no están en tokens.css (el tono apagado
     de "SUPPORT" sobre fondo oscuro y el radio de 28px de la tarjeta de bienvenida) —
     se tomaron literal del lienzo fuente (Prototipo.dc.html) por ser más específicos
     que el token genérico más cercano. Ningún otro valor se inventó. */
  :root{
    --muted-on-dark:#9AA09C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--lita-superficie-2);
    font-family:var(--lita-fuente);
    color:var(--lita-tinta);
    display:flex;
    justify-content:center;
    min-height:100dvh;
  }
  .app{
    width:100%;
    max-width:480px;
    min-height:100dvh;
    position:relative;
    background:#FFFFFF;
  }
  .screen{
    display:none;
    flex-direction:column;
    min-height:100dvh;
    width:100%;
    position:relative;
  }
  .screen.is-active{ display:flex; }

  /* ---------- Bienvenida ---------- */
  #screen-welcome{
    background:var(--lita-tinta);
    overflow:hidden;
  }
  .welcome-ring{
    position:absolute;
    left:50%;
    border-radius:50%;
    transform:translateX(-50%);
  }
  .welcome-ring--outer{ top:90px; width:300px; height:300px; border:1px solid rgba(237,234,228,.12); }
  .welcome-ring--inner{ top:140px; width:200px; height:200px; border:1px solid rgba(198,138,61,.35); }
  .welcome-mark{
    position:relative;
    display:flex;
    justify-content:center;
    padding-top:190px;
  }
  .welcome-mark span{
    width:104px; height:104px;
    border-radius:var(--lita-r-xl);
    background:var(--lita-carbon);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
  }
  .welcome-word{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding-top:30px;
  }
  .welcome-word b{
    font-size:44px; font-weight:var(--lita-peso-titulo); letter-spacing:-0.035em; line-height:1;
    color:var(--lita-crema);
  }
  .welcome-word b .accent{ color:var(--lita-ocre); }
  .welcome-word .tag{
    font-size:10px; letter-spacing:.46em; color:var(--muted-on-dark);
  }
  .welcome-card{
    margin:auto 16px 16px 16px;
    background:#FFFFFF;
    border-radius:28px;
    padding:26px 22px 22px 22px;
    display:flex; flex-direction:column; gap:10px;
  }
  .welcome-card h1{
    margin:0; font-size:28px; font-weight:var(--lita-peso-titulo);
    letter-spacing:var(--lita-tracking-titulo); line-height:1.08;
    color:var(--lita-tinta);
  }
  .welcome-card h1 .accent{ color:var(--lita-ocre-texto); }
  .welcome-card p{ margin:0; font-size:14px; line-height:1.45; color:var(--lita-texto-2); }

  .btn-primary{
    height:var(--lita-boton);
    border-radius:var(--lita-r-lg);
    border:0;
    background:var(--lita-ocre);
    color:var(--lita-tinta);
    font-family:inherit;
    font-weight:800; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
    width:100%;
  }
  .btn-primary:hover{ filter:brightness(1.04); }
  .btn-primary:disabled{ opacity:.55; cursor:default; }
  #welcome-cta{ margin-top:8px; }

  /* ---------- Acceso único ---------- */
  #screen-login{ background:#FFFFFF; }
  .login-header{
    display:flex; align-items:center; gap:12px;
    padding:18px 16px 0 16px;
  }
  .back-btn{
    width:44px; height:44px; border-radius:22px; border:0;
    background:var(--lita-superficie-2);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .eyebrow{
    font-size:12px; font-weight:700; letter-spacing:var(--lita-tracking-eyebrow);
    color:var(--lita-ocre-texto);
  }
  .login-body{
    padding:0 var(--lita-margen) 24px var(--lita-margen);
    display:flex; flex-direction:column; flex-grow:1;
  }
  .login-body > h1{
    margin:24px 0 0 0; font-size:30px; font-weight:var(--lita-peso-titulo);
    letter-spacing:var(--lita-tracking-titulo);
    color:var(--lita-tinta);
  }
  .login-body > p.sub{
    margin:8px 0 0 0; font-size:15px; line-height:1.45; color:var(--lita-texto-2);
  }
  form{ display:flex; flex-direction:column; flex-grow:1; gap:16px; padding-top:28px; }
  label{
    display:flex; flex-direction:column; gap:8px;
    font-size:13px; font-weight:700; color:var(--lita-tinta);
  }
  input{
    height:54px;
    border-radius:var(--lita-r-md);
    border:1.5px solid var(--lita-linea);
    background:var(--lita-superficie-2);
    padding:0 16px;
    font-size:16px; font-weight:400;
    color:var(--lita-tinta);
    outline:none;
    font-family:inherit;
    width:100%;
  }
  input:focus{
    border-color:var(--lita-ocre);
    box-shadow:0 0 0 2px rgba(198,138,61,.18);
  }
  .msg{
    font-size:12.5px; line-height:1.5; padding:10px 12px;
    border:1px solid transparent; border-radius:var(--lita-r-sm);
    display:none;
  }
  .msg.show{ display:block; }
  .msg.error{
    display:block; color:var(--lita-rojo-texto);
    border-color:var(--lita-rojo-borde);
    background:var(--lita-rojo-suave);
  }
  .msg.info{
    display:block; color:var(--lita-texto-2);
    border-color:var(--lita-linea);
    background:var(--lita-superficie);
  }
  .login-spacer{ flex-grow:1; min-height:16px; }
  .legal{
    display:flex; justify-content:center; flex-wrap:wrap;
    gap:6px 8px; padding-top:16px; font-size:12px; color:var(--lita-texto-2);
  }
  .legal a{
    color:var(--lita-texto-2);
    text-decoration:underline;
    text-decoration-color:var(--lita-ocre);
    text-underline-offset:3px;
  }
</style>
</head>
<body>

<div class="app">

  <div id="screen-welcome" class="screen is-active">
    <div class="welcome-ring welcome-ring--outer"></div>
    <div class="welcome-ring welcome-ring--inner"></div>
    <div class="welcome-mark">
      <span>
        <svg width="72" height="72" viewBox="0 0 48 48" fill="none" aria-hidden="true" style="color:#EDEAE4">
          <rect x="8" y="8" width="12" height="12" rx="3.2" fill="currentColor"></rect>
          <rect x="24" y="8" width="12" height="12" rx="3.2" fill="currentColor"></rect>
          <rect x="8" y="24" width="12" height="12" rx="3.2" fill="currentColor"></rect>
          <rect x="24" y="24" width="12" height="12" rx="6" fill="#C68A3D"></rect>
        </svg>
      </span>
    </div>
    <div class="welcome-word">
      <b>LiT<span class="accent">a</span></b>
      <span class="tag">SUPPORT</span>
    </div>
    <div class="welcome-card">
      <h1>Todo lo que pasa en tu turno, <span class="accent">queda escrito.</span></h1>
      <p>Checklists, temperaturas e incidencias con hora, responsable y evidencia fotográfica.</p>
      <button id="welcome-cta" class="btn-primary" type="button">Entrar a mi operación</button>
    </div>
  </div>

  <div id="screen-login" class="screen">
    <header class="login-header">
      <button id="login-back" class="back-btn" type="button" aria-label="Regresar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15181A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span class="eyebrow">PASO 1 DE 2</span>
    </header>

    <div class="login-body">
      <h1>Acceso único</h1>
      <p class="sub">Un solo login. Te llevamos directo al portal de tu operación.</p>

      <form id="login-form" autocomplete="on">
        <div>
          <label for="sso-email">Correo</label>
          <input id="sso-email" name="email" type="email" autocomplete="username" placeholder="tu@correo.com" required>
        </div>
        <div>
          <label for="sso-pass">Contraseña</label>
          <input id="sso-pass" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
        </div>

        <div id="sso-msg" class="msg"></div>

        <div class="login-spacer"></div>

        <button id="sso-btn" class="btn-primary" type="submit">Entrar</button>
      </form>

      <nav class="legal" aria-label="Privacidad">
        <a href="https://litasupport.com/privacidad" target="_blank" rel="noopener">Aviso de privacidad</a>
        <span aria-hidden="true">·</span>
        <a href="https://litasupport.com/eliminar-cuenta" target="_blank" rel="noopener">Eliminar mi cuenta</a>
      </nav>
    </div>
  </div>

</div>

<script src="./vendor/supabase.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';document.head.appendChild(s);"></script>
<script>
/* LiTa Support — Login Único (MVP de resolución, no SSO criptográfico)
 *
 * Alcance honesto (ver ESTADO.md / CLAUDE.md de este repo): esto NO emite ni verifica
 * ningún token de sesión cross-domain. Dado correo+contraseña, prueba autenticar contra
 * el backend real de Vitality Kitchen primero (rpc_login); si el servidor responde que
 * la credencial es inválida, prueba contra el backend de Corazón de Jaguar. Al primero
 * que sí valide, redirige a SU portal real con ?ssoEmail=<correo> para prellenar el
 * campo de correo ahí (ver portal.html de cada repo) -- el usuario puede tener que
 * confirmar su contraseña una vez más si la sesión no quedó activa por timing entre
 * dominios distintos. Eso es aceptable para v1.
 *
 * Nunca revela a cuál cliente pertenece un correo cuando la credencial es inválida en
 * ambos backends -- mismo mensaje genérico sin importar la causa real.
 */

var CLIENTES = [
  {
    nombre: 'vitality-control',
    url: 'https://lvugrhyknlftfgcngajc.supabase.co',
    key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2dWdyaHlrbmxmdGZnY25nYWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNDIyNzYsImV4cCI6MjEwNDgxODI3Nn0.U7BzVwzmj1mpBIZ7gElljGhCiVlIBuXnuBFGVl5eYtA',
    portal: 'https://vitality-control.github.io/portal.html'
  },
  {
    nombre: 'cdjsupport',
    url: 'https://kjvmdfzacpygzozcvlby.supabase.co',
    key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtqdm1kZnphY3B5Z3pvemN2bGJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyNTAzODIsImV4cCI6MjEwNDgyNjM4Mn0.ldBJ28FxOqBMQnhqdZzRLWiLeb4w5ohouoaSn0eJF20',
    portal: 'https://cdjsupport.github.io/portal.html'
  }
];

var _clientes = {}; // cache de createClient() por nombre

function _getClient(c){
  if(_clientes[c.nombre]) return _clientes[c.nombre];
  if(!window.supabase || !window.supabase.createClient) return null;
  _clientes[c.nombre] = window.supabase.createClient(c.url, c.key);
  return _clientes[c.nombre];
}

/* Mismo patrón que loginServidor() en portal.html de VK/CDJ (14 sep 2026): nunca
 * devuelve null -- siempre distingue 'credencial' (el servidor sí respondió, la
 * credencial es inválida) de 'sin_conexion' (no se pudo ni preguntar: timeout, red
 * caída, cliente no inicializado). */
function probarLogin(c, email, pass){
  return new Promise(function(resolve){
    var sb = _getClient(c);
    if(!sb){ resolve({ok:false, motivo:'sin_conexion'}); return; }
    var timeoutMarker = {_timeout:true};
    var timeoutP = new Promise(function(res){ setTimeout(function(){ res(timeoutMarker); }, 10000); });
    Promise.race([sb.rpc('rpc_login', {p_email: email, p_pass: pass}), timeoutP])
      .then(function(r){
        if(r === timeoutMarker){ resolve({ok:false, motivo:'sin_conexion'}); return; }
        if(r.error || !r.data){ resolve({ok:false, motivo:'sin_conexion'}); return; }
        if(!r.data.ok){ resolve({ok:false, motivo:'credencial'}); return; }
        resolve({ok:true, cliente:c});
      })
      .catch(function(){ resolve({ok:false, motivo:'sin_conexion'}); });
  });
}

document.getElementById('login-form').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var email = document.getElementById('sso-email').value.trim().toLowerCase();
  var pass  = document.getElementById('sso-pass').value;
  var msg   = document.getElementById('sso-msg');
  var btn   = document.getElementById('sso-btn');
  msg.className = 'msg';
  msg.textContent = '';
  if(!email || !pass) return;

  btn.disabled = true;
  var textoOriginal = btn.textContent;
  btn.textContent = 'Verificando…';

  try{
    if(!window.supabase){
      // Da un respiro corto por si el script self-hosted/CDN todavía está cargando.
      await new Promise(function(res){ setTimeout(res, 300); });
    }

    var motivos = [];
    var exito = null;
    for(var i=0;i<CLIENTES.length;i++){
      var r = await probarLogin(CLIENTES[i], email, pass);
      if(r.ok){ exito = CLIENTES[i]; break; }
      motivos.push(r.motivo);
    }

    if(exito){
      msg.className = 'msg info show';
      msg.textContent = 'Verificado. Entrando…';
      window.location = exito.portal + '?ssoEmail=' + encodeURIComponent(email);
      return;
    }

    var todosSinConexion = motivos.length && motivos.every(function(m){ return m === 'sin_conexion'; });
    if(todosSinConexion){
      msg.className = 'msg error show';
      msg.textContent = 'No se pudo verificar tu contraseña ahora mismo (revisa tu conexión) — intenta de nuevo.';
    } else {
      msg.className = 'msg error show';
      msg.textContent = 'Correo o contraseña incorrectos.';
    }
  } finally {
    btn.disabled = false;
    btn.textContent = textoOriginal;
  }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

/* Navegación Bienvenida <-> Acceso único -- solo alterna qué pantalla se ve (clase
 * .is-active). No toca rpc_login ni la resolución VK/CDJ de arriba en absoluto. */
(function(){
  var wScreen = document.getElementById('screen-welcome');
  var lScreen = document.getElementById('screen-login');
  document.getElementById('welcome-cta').addEventListener('click', function(){
    wScreen.classList.remove('is-active');
    lScreen.classList.add('is-active');
    document.getElementById('sso-email').focus();
  });
  document.getElementById('login-back').addEventListener('click', function(){
    lScreen.classList.remove('is-active');
    wScreen.classList.add('is-active');
  });
})();
</script>
</body>
</html>
