# Compila, firma y sube LiTa Support (iOS) a App Store Connect / TestFlight.
# Contenedor nativo SwiftUI + WKWebView (ios/), proyecto generado con XcodeGen.
# Firma efímera: ios/ci/firma.py crea un certificado Apple Distribution y un perfil
# App Store por la API al inicio de cada corrida y los revoca al final, así que la única
# credencial guardada es la llave de API. Secretos requeridos en el repo:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (contenido completo del archivo .p8)
# El número de compilación es github.run_number (siempre crece).
name: Build iOS (App Store)

on:
  workflow_dispatch:
    inputs:
      subir:
        description: "Subir a App Store Connect (TestFlight)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build-ios.yml"]

concurrency:
  group: build-ios
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Verificar secretos
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "Falta el secreto $v en el repo."; exit 1; fi
          done

      - uses: actions/checkout@v4

      - name: Xcode más reciente
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Herramientas
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages --quiet pyjwt cryptography

      - name: Crear certificado y perfil efímeros
        run: python3 ios/ci/firma.py crear

      - name: Instalar firma en llavero temporal
        run: |
          KC="$RUNNER_TEMP/lita.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/lita.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PERFIL_UUID.mobileprovision"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:support.lita.app $PERFIL_NOMBRE" ios/ExportOptions.plist

      - name: Generar proyecto
        working-directory: ios
        run: xcodegen generate

      - name: Archivar
        working-directory: ios
        run: |
          xcodebuild -project LiTa.xcodeproj -scheme LiTa -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/LiTa.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            PROVISIONING_PROFILE_SPECIFIER="$PERFIL_NOMBRE" \
            -quiet archive

      - name: Exportar .ipa
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/LiTa.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: lita-support-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa

      - name: Subir a App Store Connect
        if: ${{ github.event_name == 'push' || inputs.subir }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Revocar certificado y perfil efímeros
        if: always()
        run: |
          python3 ios/ci/firma.py revocar || true
          security delete-keychain "$RUNNER_TEMP/lita.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$HOME/.appstoreconnect/private_keys/"*.p8
